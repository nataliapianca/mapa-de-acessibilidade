<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Acessibilidade</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Carrega a biblioteca de ícones Font Awesome (para o 'X' de fechar) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/mapa.css">
</head>

<body>
    <!-- O contêiner do mapa -->
    <div id="mapa"></div>

    <!-- Botões de ação sobre o mapa -->
    <div class="map-actions">
        <button type="button" class="btn-mapa" id="btn-abrir-modal">
            <i class="fa-solid fa-plus"></i> Adicionar Local
        </button>
        <button type="button" class="btn-mapa btn-config"
            onclick="window.location.href='perfil-user.html'">Configuração</button>
    </div>

    <!-- 
      MODAL DE CADASTRO DE NOVO LOCAL 
      (Inicialmente escondido via CSS)
    -->
    <div id="modal-novo-local" class="modal-overlay">
        <div class="modal-content">
            <form id="form-novo-local">
                <div class="modal-header">
                    <h2>Adicionar Novo Local Acessível</h2>
                    <button type="button" id="btn-cancelar-modal" class="btn-fechar">&times;</button>
                </div>

                <div class="form-group">
                    <label for="local-nome">Nome do Local</label>
                    <input type="text" id="local-nome" placeholder="Ex: Shopping Vitória" required>
                </div>

                <div class="form-group">
                    <label for="local-endereco">Endereço Completo</label>
                    <input type="text" id="local-endereco" placeholder="Ex: Av. Américo Buaiz, 200 - Enseada do Suá, Vitória" required>
                    <small>O sistema encontrará as coordenadas (latitude/longitude) automaticamente.</small>
                </div>

                <div class="form-group">
                    <label for="local-descricao">Breve Descrição</label>
                    <textarea id="local-descricao" rows="2" placeholder="Ex: Possui rampas de acesso e banheiros adaptados no 2º piso." required></textarea>
                </div>

                <div class="form-group">
                    <label>Quais itens de acessibilidade você encontrou?</label>
                    <div class="tags-container">
                        <!-- 
                          NOTA: O ideal é carregar essas tags da sua API, 
                          mas por enquanto, usamos as que criamos no data.sql 
                        -->
                        <div class="tag-option">
                            <input type="checkbox" id="tag-1" class="tag-checkbox" value="1">
                            <label for="tag-1">Rampa de Acesso</label>
                        </div>
                        <div class="tag-option">
                            <input type="checkbox" id="tag-2" class="tag-checkbox" value="2">
                            <label for="tag-2">Piso Tátil</label>
                        </div>
                        <div class="tag-option">
                            <input type="checkbox" id="tag-3" class="tag-checkbox" value="3">
                            <label for="tag-3">Banheiro Adaptado</label>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-salvar">Salvar Local</button>
                </div>
            </form>
        </div>
    </div>
    <!-- Fim do Modal -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/mapa.js"></script>

    <!-- Corrigido: Removido o </div> extra que estava aqui -->
</body>

</html>
